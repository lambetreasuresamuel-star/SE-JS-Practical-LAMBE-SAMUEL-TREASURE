<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STORM - Register</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
* {
  margin: 0; padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  background: linear-gradient(180deg, #000000 0%, #0a1f8f 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
}

.container {
  width: 650px;
  text-align: center;
}

.logo-text {
  font-family: Georgia, serif;
  font-size: 60px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 4px 4px rgba(0,0,0,.4);
  margin-bottom: 10px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.logo-text:hover { opacity: 0.8; }

.subtitle {
  color: #00143b;
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 20px;
}

/* ── CLOUD SVG ── */
.cloud-wrap {
  margin-bottom: 25px;
  filter: drop-shadow(0 6px 20px rgba(91,156,246,0.4));
}

/* ── CARD ── */
.card {
  width: 100%;
  background: #fff;
  border: 1px solid #d0d0d0;
  border-radius: 25px;
  padding: 30px 25px;
}

/* ── INPUTS ── */
.input-box {
  position: relative;
  margin-bottom: 15px;
}

.input-box input {
  width: 100%;
  height: 60px;
  border: 1.5px solid #d0d0d0;
  border-radius: 15px;
  outline: none;
  background: transparent;
  font-size: 16px;
  padding-left: 55px;
  font-family: 'Poppins', sans-serif;
  transition: border-color 0.2s;
}
.input-box input:focus { border-color: #5B61FF; }
.input-box input.error { border-color: #e53935; }

.left-icon {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 20px;
  color: #aaa;
}

.err-msg {
  font-size: 12px;
  color: #e53935;
  text-align: left;
  margin-top: -10px;
  margin-bottom: 8px;
  padding-left: 8px;
  display: none;
}
.err-msg.show { display: block; }

/* ── REGISTER BTN ── */
.register {
  width: 100%;
  height: 60px;
  border: none;
  border-radius: 15px;
  background: #0b0e54;
  color: white;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: background 0.2s;
  margin-top: 6px;
}
.register:hover { background: #4a50e0; }

/* ── DIVIDER ── */
.divider {
  display: flex;
  align-items: center;
  gap: 20px;
  margin: 25px 0;
}
.line { flex: 1; height: 1px; background: #ddd; }
.or { font-size: 16px; font-weight: 600; color: #888; }

/* ── SOCIAL ── */
.social {
  width: 100%;
  height: 60px;
  border-radius: 15px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  font-family: 'Poppins', sans-serif;
  transition: opacity 0.2s, background 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
.social:hover { opacity: 0.85; }

.google {
  background: white;
  border: 1.5px solid #d0d0d0;
  color: #333;
  margin-bottom: 15px;
}
.apple {
  background: #111;
  color: white;
  border: none;
}

/* ── BOTTOM ── */
.bottom {
  margin-top: 25px;
  font-size: 15px;
  font-weight: 500;
  color: #ccc;
}
.bottom span {
  color: #5B8DEF;
  cursor: pointer;
  font-weight: 700;
}
.bottom span:hover { text-decoration: underline; }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #323232;
  color: #fff;
  padding: 14px 32px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 9999;
  white-space: nowrap;
  font-family: 'Poppins', sans-serif;
}
.toast.success { background: #2e7d32; }
.toast.error-toast { background: #c62828; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="container">

  <div class="logo-text" onclick="location.href='index.html'">STORM</div>
  <div class="subtitle">Join the Future of the Community</div>

  <!-- Beautiful Cloud + Lightning SVG -->
  <div class="cloud-wrap">
    <svg width="120" height="96" viewBox="0 0 120 96" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="cg1" cx="50%" cy="55%" r="65%">
          <stop offset="0%" stop-color="#7EC8FF"/>
          <stop offset="100%" stop-color="#2E8FE0"/>
        </radialGradient>
        <radialGradient id="cg2" cx="45%" cy="35%" r="60%">
          <stop offset="0%" stop-color="#A8DAFF"/>
          <stop offset="100%" stop-color="#4AAEFF"/>
        </radialGradient>
        <linearGradient id="bolt" x1="0" y1="0" x2="0.6" y2="1">
          <stop offset="0%" stop-color="#FFE94D"/>
          <stop offset="100%" stop-color="#FF9500"/>
        </linearGradient>
        <filter id="cs" x="-15%" y="-15%" width="130%" height="140%">
          <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1a6fbf" flood-opacity="0.35"/>
        </filter>
        <filter id="bg" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#FFD600" flood-opacity="0.7"/>
        </filter>
      </defs>

      <!-- Cloud -->
      <g filter="url(#cs)">
        <ellipse cx="60" cy="70" rx="46" ry="24" fill="url(#cg1)"/>
        <circle cx="32" cy="60" r="22" fill="url(#cg1)"/>
        <circle cx="60" cy="48" r="28" fill="url(#cg2)"/>
        <circle cx="88" cy="60" r="20" fill="url(#cg1)"/>
        <rect x="16" y="62" width="88" height="28" fill="url(#cg1)"/>
        <ellipse cx="60" cy="88" rx="46" ry="6" fill="#2680CC" opacity="0.5"/>
      </g>

      <!-- Lightning Bolt -->
      <g filter="url(#bg)">
        <polygon
          points="66,20 50,54 63,54 48,82 78,46 64,46"
          fill="url(#bolt)"
          stroke="#B86A00"
          stroke-width="1.2"
          stroke-linejoin="round"
        />
      </g>
    </svg>
  </div>

  <div class="card">

    <div class="input-box">
      <i class="fa-regular fa-user left-icon"></i>
      <input type="text" id="reg-name" placeholder="Full Name">
    </div>
    <div class="err-msg" id="name-err">Full name is required.</div>

    <div class="input-box">
      <i class="fa-regular fa-envelope left-icon"></i>
      <input type="email" id="reg-email" placeholder="Email Address">
    </div>
    <div class="err-msg" id="email-err">Please enter a valid email address.</div>

    <div class="input-box">
      <i class="fa-solid fa-lock left-icon"></i>
      <input type="password" id="reg-password" placeholder="Password">
    </div>
    <div class="err-msg" id="pass-err">Password must be at least 6 characters.</div>

    <div class="input-box">
      <i class="fa-solid fa-lock left-icon"></i>
      <input type="password" id="reg-confirm" placeholder="Confirm Password">
    </div>
    <div class="err-msg" id="confirm-err">Passwords do not match.</div>

    <button class="register" onclick="handleRegister()">Create Account</button>

    <div class="divider">
      <div class="line"></div>
      <div class="or">or</div>
      <div class="line"></div>
    </div>

    <button class="social google" onclick="socialSignup('Google')">
      <svg width="22" height="22" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Continue with Google
    </button>

    <button class="social apple" onclick="socialSignup('Apple')">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff" xmlns="http://www.w3.org/2000/svg">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      Continue with Apple
    </button>

  </div>

  <div class="bottom">
    Already have an account?
    <span onclick="location.href='login.html'">Sign In</span>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + type + ' show';
    setTimeout(() => { t.className = 'toast'; }, 3500);
  }

  function isValidEmail(v) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }

  function clearErrors() {
    ['reg-name','reg-email','reg-password','reg-confirm'].forEach(id => {
      document.getElementById(id).classList.remove('error');
    });
    ['name-err','email-err','pass-err','confirm-err'].forEach(id => {
      document.getElementById(id).classList.remove('show');
    });
  }

  function handleRegister() {
    clearErrors();
    let valid = true;

    const name     = document.getElementById('reg-name').value.trim();
    const email    = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    const confirm  = document.getElementById('reg-confirm').value;

    if (!name) {
      document.getElementById('reg-name').classList.add('error');
      document.getElementById('name-err').classList.add('show');
      valid = false;
    }
    if (!email || !isValidEmail(email)) {
      document.getElementById('reg-email').classList.add('error');
      document.getElementById('email-err').classList.add('show');
      valid = false;
    }
    if (!password || password.length < 6) {
      document.getElementById('reg-password').classList.add('error');
      document.getElementById('pass-err').classList.add('show');
      valid = false;
    }
    if (!confirm || confirm !== password) {
      document.getElementById('reg-confirm').classList.add('error');
      document.getElementById('confirm-err').classList.add('show');
      valid = false;
    }

    if (!valid) {
      showToast('Please fix the errors above.', 'error-toast');
      return;
    }

    // Check if email already registered
    const users = JSON.parse(localStorage.getItem('storm_users') || '[]');
    if (users.find(u => u.email === email)) {
      document.getElementById('reg-email').classList.add('error');
      document.getElementById('email-err').textContent = 'This email is already registered.';
      document.getElementById('email-err').classList.add('show');
      showToast('Account already exists. Please sign in.', 'error-toast');
      return;
    }

    // Save new user
    users.push({ name, email, password });
    localStorage.setItem('storm_users', JSON.stringify(users));

    showToast('Account created! Redirecting to login...', 'success');
    setTimeout(() => location.href = 'login.html', 2000);
  }

  function socialSignup(provider) {
    showToast(provider + ' signup is not yet connected.', 'error-toast');
  }
</script>

</body>
</html>

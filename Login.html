<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STORM - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="yo.css">
  <style>
    body { font-family: 'Poppins', sans-serif; }

    .err-msg {
      font-size: 12px;
      color: #e53935;
      text-align: right;
      margin-top: -14px;
      margin-bottom: 10px;
      padding-right: 4px;
      display: none;
    }
    .err-msg.show { display: block; }

    .field-row input.error { border-color: #e53935; }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #323232;
      color: #fff;
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 9999;
      white-space: nowrap;
    }
    .toast.success { background: #2e7d32; }
    .toast.error-toast { background: #c62828; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div class="page">
    <nav>
      <button class="nav-brand" onclick="location.href='Home Page.html'">STORM</button>
      <button class="nav-btn" onclick="location.href='Home Page.html'">HOME</button>
      <button class="nav-btn">CONTACT US</button>
      <button class="nav-btn">ABOUT US</button>
      <button class="nav-btn-cta" onclick="location.href='Registration Page.html'">Create your account</button>
    </nav>

    <div class="login-body">
      <h1>Continue from where<br>you left...</h1>

      <div class="field-row">
        <label for="login-email">Email/ Phone number</label>
        <input type="text" id="login-email" placeholder="you@example.com">
      </div>
      <div class="err-msg" id="email-err">Please enter a valid email address.</div>

      <div class="field-row">
        <label for="login-pw">Password</label>
        <input type="password" id="login-pw" placeholder="******">
      </div>
      <div class="err-msg" id="pw-err">Password must be at least 6 characters.</div>

      <button class="login-btn" onclick="handleLogin()">Login</button>

      <div class="or-divider">or</div>

      <button class="social-btn" onclick="socialLogin('Google')">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Login with Google
      </button>

      <button class="social-btn" onclick="socialLogin('Apple')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#111" xmlns="http://www.w3.org/2000/svg">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
        </svg>
        Login with Apple ID
      </button>

      <p style="margin-top:20px; font-size:13px; color:#888;">
        Don't have an account? 
        <span onclick="location.href='register.html'" style="color:#7B5EA7; font-weight:700; cursor:pointer;">Sign Up</span>
      </p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast ' + type + ' show';
      setTimeout(() => { t.className = 'toast'; }, 3500);
    }

    function isValidEmail(v) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    }

    function isValidPhone(v) {
      return /^\+?[\d\s\-(]{7,15}$/.test(v);
    }

    function handleLogin() {
      let valid = true;

      const emailInput = document.getElementById('login-email');
      const pwInput    = document.getElementById('login-pw');
      const emailErr   = document.getElementById('email-err');
      const pwErr      = document.getElementById('pw-err');

      // Reset
      emailInput.classList.remove('error');
      pwInput.classList.remove('error');
      emailErr.classList.remove('show');
      pwErr.classList.remove('show');
      emailErr.textContent = 'Please enter a valid email address.';
      pwErr.textContent = 'Password must be at least 6 characters.';

      const emailVal = emailInput.value.trim();
      const pwVal    = pwInput.value;

      if (!emailVal || (!isValidEmail(emailVal) && !isValidPhone(emailVal))) {
        emailInput.classList.add('error');
        emailErr.classList.add('show');
        valid = false;
      }

      if (!pwVal || pwVal.length < 6) {
        pwInput.classList.add('error');
        pwErr.classList.add('show');
        valid = false;
      }

      if (!valid) {
        showToast('Please fix the errors above.', 'error-toast');
        return;
      }

      const users = JSON.parse(localStorage.getItem('storm_users') || '[]');
      const match = users.find(u => u.email === emailVal);

      if (!match) {
        emailInput.classList.add('error');
        emailErr.textContent = 'No account found with this email.';
        emailErr.classList.add('show');
        showToast('No account found. Please register first.', 'error-toast');
        return;
      }

      if (match.password !== pwVal) {
        pwInput.classList.add('error');
        pwErr.textContent = 'Incorrect password. Try again.';
        pwErr.classList.add('show');
        showToast('Incorrect password.', 'error-toast');
        return;
      }

      localStorage.setItem('storm_current_user', JSON.stringify(match));
      showToast('Welcome back, ' + match.name + '! 👋', 'success');
      setTimeout(() => location.href = 'index.html', 2000);
    }

    function socialLogin(provider) {
      showToast(provider + ' login is not yet connected.', 'error-toast');
    }
  </script>

</body>
</html>
